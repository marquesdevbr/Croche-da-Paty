        <!--
            Fotos reais das peças. Para adicionar uma foto nova, copie a imagem para

        -->
        <div class="galeria-grid">
            <img class="galeria-item" src="assets/images/produtos/centro-de-mesa.jpg" alt="Centro de mesa de crochê preto com borda amarelo mostarda, com um vasinho de flores no centro" loading="lazy">

            <img class="galeria-item" src="assets/images/produtos/sousplat.jpg" alt="Sousplat de crochê vermelho sobre a mesa, ao lado de outras peças do jogo" loading="lazy">
